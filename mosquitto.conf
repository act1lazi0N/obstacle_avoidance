# ═══════════════════════════════════════════════════════════════
# AutoCar — Mosquitto MQTT Broker Configuration
# ═══════════════════════════════════════════════════════════════
# Place this file in the Mosquitto config directory, or run with:
#   mosquitto -c mosquitto.conf
# ═══════════════════════════════════════════════════════════════

# Listen on all interfaces, port 1883
listener 1883 0.0.0.0

# Allow anonymous connections (no username/password)
# For production, consider adding authentication.
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type information

# Connection limits
max_connections 10

# Message size limit (1MB — enough for JPEG frames)
message_size_limit 1048576

# Persistence (retain last message on restart)
persistence true
persistence_location ./mosquitto_data/
